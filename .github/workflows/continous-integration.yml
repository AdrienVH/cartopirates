name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
  - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  build-cartopirates-db:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build de l'image cartopirates-db
      run: docker build ./db --tag cartopirates-db:$(date +%s)
  build-cartopirates-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build de l'image cartopirates-api
      run: docker build ./api --tag cartopirates-api:$(date +%s)
  build-cartopirates-front:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build de l'image cartopirates-front
      run: docker build ./front --tag cartopirates-front:$(date +%s)
  docker-compose-up:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Lancement de la composition
      run: docker-compose -f docker-compose.dev.yml up -d