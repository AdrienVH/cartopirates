version: "3"
services:
  front:
    build: ./front/
    networks:
      - ingress
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cartopirates.rule=Host(`cartopirates.fr`)"
      - "traefik.http.routers.cartopirates.entrypoints=websecure"
      - "traefik.http.routers.cartopirates.tls.certresolver=letsencrypt"
  api:
    build: ./api/
    networks:
      - ingress
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cartopirates_api.rule=Host(`cartopirates.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.cartopirates_api.entrypoints=websecure"
      - "traefik.http.routers.cartopirates_api.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.cartopirates_api-stripapiprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.cartopirates_api.middlewares=cartopirates_api-stripapiprefix@docker"
    environment:
      - ENV_NAME=prod
  db:
    build: ./db/
networks:
  ingress:
    name: gateway_ingress
    external: true